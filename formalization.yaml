review:
  status: agent-reviewed
  notes: >-
    Independent mathematical review found the residue-window injection and
    the constants 1984 versus 1028 sufficient for the upper bound. The lower
    obstruction uses log(lcmUpto K times primorial K) at most 8K and an
    unbounded sequence of predecessor inputs. FIDELITY.txt and SOURCES.md
    record exact correspondence and reading limits. Final compiler,
    Comparator and independent-kernel checks must be reported separately.
fidelity:
  divergences: >-
    Uses the modern non-strict small-prime cutoff and full multiplicities.
    Replaces APSSV26's sharp PNT-based constants by weaker elementary
    Chebyshev constants. States direct witness and obstruction assertions
    rather than assigning a default value to an undefined small-input minimum.
