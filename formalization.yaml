# Candidate metadata. Final build, axiom and mechanical verification facts are pending.
version: v0.4
project:
  name: "Elementary bounds for Erdos problem 684"
  description: >-
    Let U(n,k) be the full prime-power part of the binomial coefficient n choose k
    supported on primes at most k. For all sufficiently large n, there exists
    k at most n with k at most 514(log n)^2 and U(n,k) greater than n squared.
    For arbitrarily large n greater than one, U(n,k) equals one throughout
    k at most (log n)/8. This independent Mathlib-only implementation adapts
    the known residue averaging and prime-power obstruction of APSSV26 with
    coarse Chebyshev constants. It does not formalize that paper's sharper
    coefficients or Bae's stronger registered lower bound. The optimal order
    remains open and no mathematical novelty is claimed.
  authors: [AItoBit]
  responsible_maintainers: [AItoBit]
  license: Apache-2.0
classification:
  arxiv: [math.NT]
  msc2020: [11B65, 11N05, 11A51]
sources:
  - title: "Short proofs in combinatorics and number theory"
    authors:
      - Boris Alexeev
      - Moe Putterman
      - Mehtaab Sawhney
      - Mark Sellke
      - Gregory Valiant
    id: "https://arxiv.org/abs/2603.29961v2"
    location: "Section 2, Theorem 2.1"
    type: article
    relationship: adapts
    note: >-
      The residue averaging strategy and prime-power obstruction are adapted
      with weaker explicit constants 514 and 1/8. The paper attributes its
      proofs to an internal OpenAI model; human authors digested and edited
      the proofs. No source-author endorsement or participation is claimed.
  - title: "Some unconventional problems in number theory"
    authors: [Paul Erdos]
    id: "https://doi.org/10.1007/BF01903382"
    location: "Acta Math. Acad. Sci. Hungar. 33 (1979), 71-80; pages 74, 76 and 77"
    type: article
    relationship: background
    note: "The original strict prime cutoff is replaced by the modern APSSV26 cutoff p <= k."
